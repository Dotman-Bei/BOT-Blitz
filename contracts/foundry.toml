[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Conservative target: BOT Chain is Geth/Parlia-derived; "paris" avoids PUSH0/MCOPY
# so the bytecode runs regardless of which later hardforks a node has activated.
evm_version = "paris"
optimizer = true
optimizer_runs = 10000

[rpc_endpoints]
bot_testnet = "${BOT_RPC_URL}"
bot_mainnet = "${BOT_MAINNET_RPC_URL}"

[fmt]
line_length = 110
